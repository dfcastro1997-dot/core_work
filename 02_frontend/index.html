<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORE-WORK | OPS Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tipografía limpia */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F9FAFB; color: #111827; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Menú Lateral (Sidebar) Blanco y Negro -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col">
        <div class="h-16 flex items-center px-6 border-b border-gray-200">
            <h1 class="text-2xl font-bold tracking-tighter text-black">CORE<span class="text-red-600">-WORK</span></h1>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="#" class="flex items-center px-4 py-2 bg-red-50 text-red-600 rounded-lg font-semibold border-r-4 border-red-600">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Dashboard
            </a>
            <a href="#" class="flex items-center px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                Agenda
            </a>
            <a href="#" class="flex items-center px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Finanzas
            </a>
            <a href="#" class="flex items-center px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"></path></svg>
                Infraestructura (OPS)
            </a>
        </nav>
    </aside>

    <!-- Contenido Principal -->
    <main class="flex-1 flex flex-col overflow-y-auto">
        <!-- Header -->
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8">
            <h2 class="text-xl font-semibold text-gray-800">Resumen de Operaciones</h2>
            <div class="flex items-center">
                <span class="w-3 h-3 bg-red-500 rounded-full mr-2 animate-pulse"></span>
                <span class="text-sm text-gray-600 font-medium">Sistemas en línea</span>
            </div>
        </header>

        <!-- Panel de Control -->
        <div class="p-8 space-y-6">
            
            <!-- Tarjetas de Resumen -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm border-t-4 border-t-black">
                    <p class="text-sm text-gray-500 font-medium uppercase">Tareas Activas</p>
                    <h3 class="text-3xl font-bold mt-2" id="task-count">0</h3>
                </div>
                <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm border-t-4 border-t-red-600">
                    <p class="text-sm text-gray-500 font-medium uppercase">Alertas OPS</p>
                    <h3 class="text-3xl font-bold mt-2 text-red-600">2</h3>
                </div>
                <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm border-t-4 border-t-gray-300">
                    <p class="text-sm text-gray-500 font-medium uppercase">Ingresos Mes</p>
                    <h3 class="text-3xl font-bold mt-2">$4,250</h3>
                </div>
            </div>

            <!-- Sección de Tareas -->
            <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                    <h3 class="font-bold text-lg text-gray-800">Actividades Pendientes</h3>
                    <button onclick="addTask()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-colors shadow-sm">
                        + Nueva Tarea
                    </button>
                </div>
                <div class="p-6">
                    <ul id="task-list" class="space-y-3">
                        <!-- Las tareas se inyectarán aquí por JS -->
                        <li class="text-gray-500 text-sm text-center">Cargando tareas...</li>
                    </ul>
                </div>
            </div>

        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
