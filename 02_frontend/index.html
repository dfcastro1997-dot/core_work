<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Cloud | Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen overflow-hidden">
    
    <div class="w-full max-w-sm bg-white p-10 rounded-2xl shadow-2xl border border-gray-100 relative">
        <!-- Detalle de diseño superior -->
        <div class="absolute top-0 left-0 w-full h-2 bg-red-600 rounded-t-2xl"></div>

        <div class="text-center mb-8 mt-2">
            <h1 class="text-3xl font-extrabold tracking-tight text-black mb-1">
                SECURITY <span class="text-red-600">CLOUD</span>
            </h1>
            <p class="text-sm text-gray-500 font-semibold">Plataforma de Entrenamiento</p>
        </div>
        
        <form onsubmit="login(event)" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1 tracking-wider">Usuario / ID</label>
                <input type="text" id="username" required placeholder="Ej. operador" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-transparent transition-shadow">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1 tracking-wider">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-transparent transition-shadow">
            </div>
            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-lg shadow-md hover:shadow-lg transition-all mt-4">
                Ingresar al Sistema
            </button>
        </form>

        <div class="mt-8 text-center border-t border-gray-100 pt-6">
            <p class="text-[10px] text-gray-400 font-mono">USUARIOS DE PRUEBA CREADOS:</p>
            <p class="text-[11px] text-gray-500 mt-1">Admin: <b class="text-gray-800">admin</b> | Escuela: <b class="text-gray-800">academia</b> | Operador: <b class="text-gray-800">operador</b></p>
            <p class="text-[11px] text-gray-500">Pass para todos: <b class="text-gray-800">123</b></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
