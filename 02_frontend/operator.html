<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Cloud | Centro de Entrenamiento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 flex h-screen overflow-hidden">

    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col z-20 shadow-sm relative">
        <div class="absolute top-0 left-0 w-full h-1.5 bg-red-600"></div>
        <div class="h-20 flex items-center justify-center px-6 border-b border-gray-100 mt-1">
            <img src="https://i.ibb.co/DHmrYHsN/Group-339.png" alt="Logo" class="h-8 object-contain">
        </div>
        
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="#" onclick="switchView('dashboard')" class="nav-btn flex items-center px-4 py-3 bg-red-50 text-red-700 rounded-lg font-bold transition-colors border-l-4 border-red-600" id="nav-dash">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Simuladores (Prácticas)
            </a>
            <a href="#" onclick="switchView('quizzes'); loadOperatorQuizzes();" class="nav-btn flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-black rounded-lg font-semibold transition-colors border-l-4 border-transparent" id="nav-quizzes">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                Mis Evaluaciones (Quizzes)
            </a>
        </nav>
        
        <div class="p-4 border-t border-gray-100">
            <button onclick="logout()" class="flex items-center w-full px-4 py-3 text-gray-600 hover:bg-red-50 rounded-lg font-bold">Cerrar Sesión</button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="h-20 bg-white border-b border-gray-200 shadow-sm px-8 flex justify-between items-center z-10">
            <h2 class="text-xl font-extrabold text-black tracking-tight">Centro de Entrenamiento Virtual</h2>
            <div class="flex items-center space-x-4">
                <div class="text-right">
                    <span id="user-role" class="block text-[10px] font-bold text-red-600 uppercase"></span>
                    <span id="user-welcome" class="block text-sm font-bold text-black"></span>
                </div>
                <div id="top-right-logo-container" class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center overflow-hidden shrink-0">
                    <span id="top-right-initials">OP</span>
                    <img id="top-right-logo" src="" alt="Logo" class="hidden w-full h-full object-cover">
                </div>
            </div>
        </header>

        <!-- DASHBOARD (Simuladores 3D) -->
        <main id="dashboard-view" class="main-view flex-1 overflow-y-auto p-8 flex flex-col items-center">
            <div class="w-full max-w-5xl space-y-10">
                <div class="text-left border-b border-gray-200 pb-4">
                    <h2 class="text-2xl font-extrabold text-black">Laboratorios de Simulación Táctica</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8" id="simulators-container"></div>
                <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm mt-8">
                    <h3 class="text-xl font-bold text-black mb-6">Mis Certificaciones PDF (Prácticas)</h3>
                    <ul id="my-certificates" class="space-y-3"></ul>
                </div>
            </div>
        </main>

        <!-- LISTA DE EXAMENES -->
        <main id="quizzes-view" class="main-view flex-1 overflow-y-auto p-8 hidden">
            <div class="w-full max-w-5xl mx-auto bg-white p-8 rounded-2xl border border-gray-200 shadow-sm h-full flex flex-col">
                <h2 class="text-2xl font-extrabold text-black border-b border-gray-100 pb-4 mb-6">Evaluaciones Teóricas Pendientes</h2>
                <div id="operator-quiz-list" class="grid grid-cols-1 md:grid-cols-2 gap-6 flex-1 overflow-y-auto pr-2">
                    <!-- Llenado por JS -->
                </div>
            </div>
        </main>

        <!-- TOMAR EXAMEN (Pantalla Completa Simulada) -->
        <div id="take-quiz-view" class="hidden absolute inset-0 bg-gray-50 z-40 flex flex-col">
            <div class="bg-white px-8 py-4 flex justify-between items-center shadow-md border-b-4 border-red-600 z-50">
                <h3 id="active-quiz-title" class="font-extrabold text-xl text-black">Examen</h3>
                <div class="bg-red-50 border border-red-200 text-red-700 px-6 py-2 rounded-lg font-mono font-bold text-xl flex items-center shadow-sm">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span id="quiz-timer">00:00</span>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-8 flex justify-center">
                <div class="w-full max-w-3xl bg-white p-8 rounded-2xl border border-gray-200 shadow-lg h-fit">
                    <form id="quiz-form" onsubmit="submitQuiz(event)">
                        <div id="quiz-questions-render" class="space-y-8"></div>
                        <div class="mt-10 pt-6 border-t border-gray-200 flex justify-end">
                            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 px-10 rounded-lg shadow-md transition-colors text-lg">Entregar Evaluación</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- SIMULADOR 3D -->
        <div id="sim-view" class="hidden absolute inset-0 bg-white z-50 flex flex-col">
            <div class="bg-black p-4 flex justify-between items-center shadow-lg border-b-4 border-red-600">
                <h3 id="sim-title" class="font-bold text-white uppercase text-sm">Simulador Activo</h3>
                <button onclick="finishSim()" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded text-white font-bold text-xs uppercase">Terminar</button>
            </div>
            <div class="flex-1 flex items-center justify-center bg-gray-100"><p>Loading Engine...</p></div>
        </div>
    </div>

    <!-- Modal Alerta -->
    <div id="alert-modal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm hidden flex items-center justify-center z-[100]">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl text-center">
            <div id="alert-icon-container" class="mx-auto w-12 h-12 rounded-full flex items-center justify-center mb-4"></div>
            <h3 id="alert-title" class="text-lg font-bold text-black mb-2">Mensaje</h3>
            <p id="alert-message" class="text-sm text-gray-600 mb-6"></p>
            <button onclick="closeAlertModal()" class="w-full bg-black text-white py-2.5 rounded-lg font-bold">Aceptar</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function switchView(view) {
            document.querySelectorAll('.main-view').forEach(v => v.classList.add('hidden'));
            document.getElementById(view + '-view').classList.remove('hidden');
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.replace('bg-red-50', 'text-gray-600');
                btn.classList.replace('text-red-700', 'hover:bg-gray-50');
                btn.classList.replace('border-red-600', 'border-transparent');
            });

            let activeBtn = view === 'dashboard' ? 'nav-dash' : 'nav-quizzes';
            if(activeBtn) {
                const btn = document.getElementById(activeBtn);
                btn.classList.replace('text-gray-600', 'bg-red-50');
                btn.classList.replace('hover:bg-gray-50', 'text-red-700');
                btn.classList.replace('border-transparent', 'border-red-600');
            }
        }
    </script>
</body>
</html>
