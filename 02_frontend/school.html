<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Cloud | Panel Academia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen flex flex-col overflow-hidden">

    <header class="bg-white border-b border-gray-200 shadow-sm p-5 flex justify-between items-center z-10">
        <h1 class="text-xl md:text-2xl font-extrabold tracking-tight text-black">
            SECURITY <span class="text-red-600">CLOUD</span>
        </h1>
        <div class="flex items-center space-x-6">
            <div class="flex flex-col text-right">
                <span id="user-role" class="text-[10px] font-bold text-red-600 uppercase tracking-wider"></span>
                <span id="user-welcome" class="text-sm font-bold text-black"></span>
            </div>
            <button onclick="logout()" class="text-xs bg-black text-white px-4 py-2 rounded-lg font-bold hover:bg-gray-800 transition-colors shadow-sm">
                Salir
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-6 md:p-10 flex flex-col items-center">
        <div class="w-full max-w-6xl grid grid-cols-1 md:grid-cols-12 gap-8">
            
            <div class="md:col-span-5 space-y-8">
                <!-- Crear Operador -->
                <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm border-t-4 border-t-black">
                    <h2 class="text-lg font-bold mb-4 text-black flex items-center">
                        <svg class="w-5 h-5 mr-2 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                        Inscribir Operador
                    </h2>
                    <form onsubmit="createOperator(event)" class="space-y-4">
                        <input type="text" id="op-username" placeholder="Cédula o Nombre del Alumno" required class="w-full bg-gray-50 p-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-red-600 outline-none">
                        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white p-3 rounded-lg font-bold shadow-sm transition-colors">
                            Generar Acceso Alumno
                        </button>
                    </form>
                </div>
                
                <!-- Resultados / Certificados -->
                <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm">
                    <h2 class="text-lg font-bold mb-4 text-black">Auditoría de Certificados</h2>
                    <div id="school-results-display" class="bg-gray-50 border border-gray-200 p-4 rounded-lg min-h-[150px] overflow-y-auto max-h-64">
                        <p class="text-sm text-gray-500 italic text-center mt-8">Selecciona "Ver Reportes" en un alumno de la lista.</p>
                    </div>
                </div>
            </div>

            <!-- Lista de Estudiantes -->
            <div class="md:col-span-7 bg-white p-6 rounded-2xl border border-gray-200 shadow-sm flex flex-col">
                <h2 class="text-lg font-bold mb-2 text-black border-b border-gray-100 pb-4">Nómina de Estudiantes Activos</h2>
                <ul id="operator-list" class="flex-1 overflow-y-auto mt-4 space-y-2"></ul>
            </div>
            
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
