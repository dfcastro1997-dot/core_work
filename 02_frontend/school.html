<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Cloud | Panel Academia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- CHART JS LIBRERIA -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 flex h-screen overflow-hidden">

    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col z-20 shadow-sm relative">
        <div class="absolute top-0 left-0 w-full h-1.5 bg-black"></div>
        <div class="h-20 flex items-center justify-center px-6 border-b border-gray-100 mt-1">
            <img src="https://i.ibb.co/DHmrYHsN/Group-339.png" alt="Security Cloud Logo" class="h-8 object-contain">
        </div>
        
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <p class="px-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Administración</p>
            <a href="#" class="flex items-center px-4 py-3 bg-gray-100 text-black rounded-lg font-bold transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg> Dashboard
            </a>
        </nav>
        
        <div class="p-4 border-t border-gray-100">
            <button onclick="logout()" class="flex items-center w-full px-4 py-3 text-gray-600 hover:bg-red-50 hover:text-red-700 rounded-lg font-bold transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg> Cerrar Sesión
            </button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-20 bg-white border-b border-gray-200 shadow-sm px-8 flex justify-between items-center z-10">
            <h2 class="text-xl font-extrabold text-black tracking-tight">Portal de la Academia</h2>
            <div class="flex items-center space-x-4">
                <div class="text-right">
                    <span id="user-role" class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider"></span>
                    <span id="user-welcome" class="block text-sm font-bold text-black"></span>
                </div>
                <div id="top-right-logo-container" class="w-10 h-10 bg-red-600 text-white rounded-full flex items-center justify-center font-bold shadow-md overflow-hidden shrink-0">
                    <span id="top-right-initials">AC</span>
                    <img id="top-right-logo" src="" alt="Logo Academia" class="hidden w-full h-full object-cover bg-white">
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-8 flex justify-center">
            <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                
                <div class="lg:col-span-5 space-y-6">
                    <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm">
                        <div class="flex items-center mb-6">
                            <div class="w-10 h-10 bg-red-50 text-red-600 rounded-lg flex items-center justify-center mr-4">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                            </div>
                            <div>
                                <h2 class="text-lg font-bold text-black">Inscribir Personal</h2>
                                <p class="text-xs text-gray-500">Limites controlados por el sistema.</p>
                            </div>
                        </div>
                        <form onsubmit="createPersonnel(event)" class="space-y-4">
                            <div class="grid grid-cols-2 gap-3">
                                <select id="op-role" required class="w-full bg-gray-50 p-3.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-red-600 outline-none cursor-pointer">
                                    <option value="operator">Operador</option>
                                    <option value="instructor">Instructor</option>
                                </select>
                                <input type="text" id="op-username" placeholder="Identificador / ID" required class="w-full bg-gray-50 p-3.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-red-600 outline-none">
                            </div>
                            <input type="password" id="op-password" placeholder="Contraseña Inicial" required class="w-full bg-gray-50 p-3.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-red-600 outline-none">
                            <button type="submit" class="w-full bg-black hover:bg-gray-800 text-white p-3.5 rounded-lg font-bold shadow-md transition-colors mt-2">Generar Acceso</button>
                        </form>
                    </div>

                    <!-- NUEVO PANEL DE KPI Y EXPORTACION -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm text-center">
                            <h4 class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1">Efectividad Global</h4>
                            <span class="text-3xl font-extrabold text-black" id="kpi-score">0%</span>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-sm flex items-center justify-center">
                            <button onclick="exportToCSV()" class="w-full h-full bg-green-600 hover:bg-green-700 text-white text-xs font-bold rounded-lg shadow-sm flex flex-col items-center justify-center transition-colors">
                                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                Exportar Reporte CSV
                            </button>
                        </div>
                    </div>
                    
                    <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm flex flex-col h-[280px]">
                        <h2 class="text-sm font-bold mb-2 text-black">Historial Analítico</h2>
                        <!-- CANVAS PARA CHART.JS -->
                        <div class="flex-1 w-full h-full relative">
                            <canvas id="schoolChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-7 bg-white p-8 rounded-2xl border border-gray-200 shadow-sm flex flex-col h-[820px]">
                    <h2 class="text-lg font-bold mb-2 text-black border-b border-gray-100 pb-4">Nómina de Personal Activo</h2>
                    <ul id="operator-list" class="flex-1 overflow-y-auto mt-4 space-y-3 pr-2"></ul>
                </div>
            </div>
        </main>
    </div>

    <!-- Modales idénticos a los anteriores (Edición Personal, Alert, Confirm) -->
    <div id="school-personnel-modal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white w-full max-w-md rounded-2xl p-8 shadow-2xl border border-gray-200">
            <h3 class="text-xl font-bold text-black mb-4 border-b border-gray-100 pb-3" id="sp-modal-title">Editar Personal</h3>
            <form id="sp-modal-form" onsubmit="saveSchoolPersonnel(event)" class="space-y-4">
                <input type="hidden" id="sp-id">
                <select id="sp-role" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-3 text-sm cursor-pointer"><option value="operator">Operador</option><option value="instructor">Instructor</option></select>
                <input type="text" id="sp-username" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-3 text-sm">
                <input type="text" id="sp-password" placeholder="(Opcional para actualizar)" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-3 text-sm">
                <div class="flex justify-end space-x-3 pt-4 border-t border-gray-100">
                    <button type="button" onclick="closeSchoolPersonnelModal()" class="px-5 py-2.5 bg-gray-100 text-gray-800 rounded-lg font-bold hover:bg-gray-200">Cancelar</button>
                    <button type="submit" class="px-5 py-2.5 bg-black text-white rounded-lg font-bold hover:bg-red-600 transition-colors">Guardar Datos</button>
                </div>
            </form>
        </div>
    </div>
    
    <div id="alert-modal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm hidden flex items-center justify-center z-[100]">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl border border-gray-200 text-center">
            <div id="alert-icon-container" class="mx-auto w-12 h-12 rounded-full flex items-center justify-center mb-4"></div>
            <h3 id="alert-title" class="text-lg font-bold text-black mb-2">Mensaje</h3>
            <p id="alert-message" class="text-sm text-gray-600 mb-6"></p>
            <button onclick="closeAlertModal()" class="w-full bg-black text-white py-2.5 rounded-lg font-bold hover:bg-red-600 transition-colors">Aceptar</button>
        </div>
    </div>

    <div id="confirm-modal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm hidden flex items-center justify-center z-[100]">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl border border-gray-200 text-center">
            <div class="mx-auto w-12 h-12 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center mb-4"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg></div>
            <h3 id="confirm-title" class="text-lg font-bold text-black mb-2">¿Estás seguro?</h3>
            <p id="confirm-message" class="text-sm text-gray-600 mb-6"></p>
            <div class="flex justify-center space-x-3">
                <button onclick="closeConfirmModal(false)" class="px-5 py-2.5 bg-gray-100 text-gray-800 rounded-lg font-bold hover:bg-gray-200">Cancelar</button>
                <button onclick="closeConfirmModal(true)" class="px-5 py-2.5 bg-red-600 text-white rounded-lg font-bold hover:bg-red-700">Sí, continuar</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
