<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORE-WORK | Agenda Global</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #0F172A; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col z-10">
        <div class="h-16 flex items-center px-6 border-b border-slate-200">
            <h1 class="text-2xl font-bold tracking-tighter text-slate-900">CORE<span class="text-red-600">-WORK</span></h1>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-1.5">
            <a href="index.html" class="flex items-center px-4 py-2.5 text-slate-600 hover:bg-slate-100 hover:text-slate-900 rounded-lg font-medium transition-all">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Dashboard
            </a>
            <a href="agenda.html" class="flex items-center px-4 py-2.5 bg-slate-900 text-white rounded-lg font-semibold transition-all shadow-sm">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                Agenda
            </a>
            <a href="finanzas.html" class="flex items-center px-4 py-2.5 text-slate-600 hover:bg-slate-100 hover:text-slate-900 rounded-lg font-medium transition-all">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Finanzas
            </a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 sticky top-0 z-20">
            <h2 class="text-lg font-semibold text-slate-800">Agenda de Actividades & Compromisos</h2>
            <button onclick="openEventModal()" class="bg-slate-900 hover:bg-slate-800 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-colors">
                + Nuevo Evento
            </button>
        </header>

        <div class="p-8 space-y-6">
            <div id="event-grid" class="grid grid-cols-1 md:grid-cols-3 gap-5">
                <!-- Los eventos agregados dinámicamente aparecerán aquí -->
            </div>
            <div id="empty-agenda-msg" class="hidden text-center py-16 bg-white rounded-xl border border-slate-200 p-8">
                <p class="text-slate-500 text-sm">No hay eventos registrados en la agenda.</p>
                <button onclick="openEventModal()" class="mt-3 text-xs font-semibold text-slate-900 underline hover:text-slate-700">Agregar primer evento</button>
            </div>
        </div>
    </main>

    <!-- Modal Agregar Evento -->
    <div id="event-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white w-full max-w-md rounded-xl p-6 shadow-2xl border border-slate-200">
            <h3 class="text-base font-bold text-slate-900 mb-4">Agendar Evento</h3>
            <form id="event-form" onsubmit="saveEvent(event)" class="space-y-3.5">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nombre del Evento</label>
                    <input type="text" id="event-name" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-slate-900">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Empresa</label>
                        <select id="event-company" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-slate-900">
                            <option value="Empresa A">Empresa A</option>
                            <option value="Empresa B">Empresa B</option>
                            <option value="Personal">Personal</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Duración / Horario</label>
                        <input type="text" id="event-duration" placeholder="Ej: 1h 30m / 09:00 - 10:30" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-slate-900">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Ubicación / Enlace</label>
                    <input type="text" id="event-location" placeholder="Ej: Google Meet / Presencial Oficina" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-slate-900">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Detalles / Notas</label>
                    <textarea id="event-details" rows="3" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-slate-900" placeholder="Puntos a tratar..."></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeEventModal()" class="px-3.5 py-2 border border-slate-300 text-slate-700 rounded-lg text-xs font-semibold hover:bg-slate-50">Cancelar</button>
                    <button type="submit" class="px-3.5 py-2 bg-slate-900 text-white rounded-lg text-xs font-semibold hover:bg-slate-800">Guardar Evento</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
