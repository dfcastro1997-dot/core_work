<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORE-WORK | Agenda Global</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #0F172A; }
        .calendar-cell { min-height: 100px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col z-10">
        <div class="h-16 flex items-center px-6 border-b border-slate-200">
            <h1 class="text-2xl font-bold tracking-tighter text-slate-900">CORE<span class="text-red-600">-WORK</span></h1>
        </div>
        <!-- Fragmento del Menú Lateral (Agrega el Kanban) -->
        <nav class="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto custom-scroll">
            <!-- Dashboard -->
            <a href="index.html" class="flex items-center px-4 py-2.5 text-slate-600 hover:bg-slate-100 hover:text-slate-900 rounded-lg font-medium transition-all">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Dashboard
            </a>
            
            <!-- Tablero Kanban -->
            <a href="kanban.html" class="flex items-center px-4 py-2.5 text-slate-600 hover:bg-slate-100 hover:text-slate-900 rounded-lg font-medium transition-all">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"></path></svg>
                Tablero Kanban
            </a>

            <!-- Agenda -->
            <a href="agenda.html" class="flex items-center px-4 py-2.5 text-slate-600 hover:bg-slate-100 hover:text-slate-900 rounded-lg font-medium transition-all">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                Agenda
            </a>

            <!-- Finanzas -->
            <a href="finanzas.html" class="flex items-center px-4 py-2.5 text-slate-600 hover:bg-slate-100 hover:text-slate-900 rounded-lg font-medium transition-all">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Finanzas
            </a>

            <!-- Telaraña -->
            <a href="telarana.html" class="flex items-center px-4 py-2.5 text-slate-600 hover:bg-slate-100 hover:text-slate-900 rounded-lg font-medium transition-all">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                Telaraña
            </a>

            <!-- Configuraciones -->
            <a href="configuraciones.html" class="flex items-center px-4 py-2.5 text-slate-600 hover:bg-slate-100 hover:text-slate-900 rounded-lg font-medium transition-all">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Configuraciones
            </a>
        </nav>
        
    </aside>

    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 sticky top-0 z-20">
            <h2 class="text-lg font-semibold text-slate-800">Calendario de Operaciones</h2>
            <button onclick="openEventModal()" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-1.5 rounded-lg text-xs font-semibold transition-colors">
                + Agendar Evento
            </button>
        </header>

        <div class="p-8">
            <div class="bg-white border border-slate-200 shadow-sm rounded-xl overflow-hidden">
                <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200 bg-slate-50/50">
                    <button onclick="changeMonth(-1)" class="p-1.5 text-slate-500 hover:text-slate-900 hover:bg-slate-200 rounded transition-colors">&larr; Anterior</button>
                    <h3 class="font-bold text-lg text-slate-900 capitalize" id="calendar-month-year">Cargando...</h3>
                    <button onclick="changeMonth(1)" class="p-1.5 text-slate-500 hover:text-slate-900 hover:bg-slate-200 rounded transition-colors">Siguiente &rarr;</button>
                </div>
                
                <div class="grid grid-cols-7 border-b border-slate-200 bg-slate-100 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                    <div class="py-2 text-center">Dom</div>
                    <div class="py-2 text-center">Lun</div>
                    <div class="py-2 text-center">Mar</div>
                    <div class="py-2 text-center">Mié</div>
                    <div class="py-2 text-center">Jue</div>
                    <div class="py-2 text-center">Vie</div>
                    <div class="py-2 text-center">Sáb</div>
                </div>

                <div id="calendar-grid" class="grid grid-cols-7 bg-slate-200 gap-px"></div>
            </div>
        </div>
    </main>

    <!-- Modal Agregar Evento -->
    <div id="event-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white w-full max-w-md rounded-xl p-6 shadow-2xl border border-slate-200">
            <h3 class="text-base font-bold text-slate-900 mb-4">Agendar Evento</h3>
            <form id="event-form" onsubmit="saveEvent(event)" class="space-y-3.5">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nombre del Evento</label>
                    <input type="text" id="evt-name" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-slate-900">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Fecha</label>
                        <input type="date" id="evt-date" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-slate-900">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Hora / Duración</label>
                        <input type="text" id="evt-time" placeholder="Ej: 14:00 (1h)" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-slate-900">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Perfil / Entidad</label>
                        <select id="evt-company" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-slate-900 dynamic-profiles">
                            <!-- JS -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Ubicación</label>
                        <input type="text" id="evt-location" placeholder="Link o lugar" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-slate-900">
                    </div>
                </div>
                <div class="flex justify-end space-x-2 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeEventModal()" class="px-3.5 py-2 border border-slate-300 text-slate-700 rounded-lg text-xs font-semibold hover:bg-slate-50">Cancelar</button>
                    <button type="submit" class="px-3.5 py-2 bg-slate-900 text-white rounded-lg text-xs font-semibold hover:bg-slate-800">Guardar Evento</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Eliminar Evento -->
    <div id="event-action-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white w-full max-w-sm rounded-xl p-6 shadow-2xl border border-slate-200 text-center">
            <h3 class="text-base font-bold text-slate-900 mb-1" id="action-evt-name">Nombre Evento</h3>
            <p class="text-xs text-slate-500 mb-6" id="action-evt-desc">Detalles</p>
            <div class="flex justify-center space-x-2">
                <button onclick="closeActionModal()" class="px-3.5 py-2 border border-slate-300 text-slate-700 rounded-lg text-xs font-semibold hover:bg-slate-50">Cerrar</button>
                <button onclick="deleteSelectedEvent()" class="px-3.5 py-2 bg-red-600 text-white rounded-lg text-xs font-semibold hover:bg-red-700">Eliminar Evento</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
