<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Cloud | Portal Instructor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 flex h-screen overflow-hidden">

    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col z-20 shadow-sm relative">
        <div class="absolute top-0 left-0 w-full h-1.5 bg-red-600"></div>
        <div class="h-20 flex items-center justify-center px-6 border-b border-gray-100 mt-1">
            <img src="https://i.ibb.co/DHmrYHsN/Group-339.png" alt="Security Cloud Logo" class="h-8 object-contain">
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="#" onclick="switchView('dashboard')" class="flex items-center px-4 py-3 bg-red-50 text-red-700 rounded-lg font-bold transition-colors border-l-4 border-red-600" id="nav-dash">
                Ejercicios Propios
            </a>
            <a href="#" onclick="switchView('evaluations')" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-black rounded-lg font-semibold transition-colors border-l-4 border-transparent" id="nav-eval">
                Auditar Alumnos
            </a>
        </nav>
        <div class="p-4 border-t border-gray-100">
            <button onclick="logout()" class="flex items-center w-full px-4 py-3 text-gray-600 hover:bg-red-50 hover:text-red-700 rounded-lg font-bold transition-colors">Cerrar Sesión</button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="h-20 bg-white border-b border-gray-200 shadow-sm px-8 flex justify-between items-center z-10">
            <h2 class="text-xl font-extrabold text-black tracking-tight">Portal de Instructor</h2>
            <div class="flex items-center space-x-4">
                <div class="text-right">
                    <span id="user-role" class="block text-[10px] font-bold text-red-600 uppercase tracking-wider"></span>
                    <span id="user-welcome" class="block text-sm font-bold text-black"></span>
                </div>
                <div id="top-right-logo-container" class="w-10 h-10 bg-gray-200 border border-gray-300 text-gray-600 rounded-full flex items-center justify-center font-bold overflow-hidden shrink-0">
                    <span id="top-right-initials">SC</span>
                    <img id="top-right-logo" src="" alt="Logo" class="hidden w-full h-full object-cover bg-white">
                </div>
            </div>
        </header>

        <!-- VISTA: MIS EJERCICIOS -->
        <main id="dashboard-view" class="flex-1 overflow-y-auto p-8 flex flex-col items-center">
            <div class="w-full max-w-5xl space-y-10">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8" id="simulators-container">
                    <!-- Dinámico por JS -->
                </div>
                <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm mt-8">
                    <h3 class="text-xl font-bold text-black mb-6">Mis Certificaciones PDF</h3>
                    <ul id="my-certificates" class="space-y-3"></ul>
                </div>
            </div>
        </main>

        <!-- VISTA: AUDITORIA DE ALUMNOS -->
        <main id="evaluations-view" class="flex-1 overflow-y-auto p-8 hidden">
            <div class="w-full max-w-5xl mx-auto bg-white p-8 rounded-2xl border border-gray-200 shadow-sm h-full flex flex-col">
                <h2 class="text-2xl font-extrabold text-black border-b border-gray-100 pb-4 mb-4">Auditoría de Evaluaciones (Toda la Academia)</h2>
                <div id="school-general-results" class="flex-1 overflow-y-auto space-y-4 pr-2">
                    <!-- Llenado por JS -->
                </div>
            </div>
        </main>

        <!-- SIMULADOR -->
        <div id="sim-view" class="hidden absolute inset-0 bg-white z-50 flex flex-col">
            <div class="bg-black p-4 flex justify-between items-center shadow-lg z-10 border-b-4 border-red-600">
                <div class="flex items-center space-x-3">
                    <div class="w-3 h-3 bg-red-600 rounded-full animate-pulse"></div>
                    <h3 id="sim-title" class="font-bold text-white tracking-widest text-sm uppercase">Simulador Activo</h3>
                </div>
                <button onclick="finishSim()" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded text-white font-bold text-xs uppercase tracking-wider transition-colors shadow-lg">Terminar</button>
            </div>
            <div class="flex-1 flex flex-col items-center justify-center bg-gray-100 relative">
                <p class="font-mono text-gray-500 text-xs mt-4">Security Cloud 3D Engine is loading...</p>
            </div>
        </div>
    </div>

    <!-- Modal Agregar Feedback -->
    <div id="feedback-modal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white w-full max-w-lg rounded-2xl p-8 shadow-2xl border border-gray-200">
            <h3 class="text-xl font-bold text-black mb-2">Comentario del Instructor</h3>
            <p class="text-sm text-gray-500 mb-4">El operador verá esto impreso en su PDF oficial.</p>
            <form onsubmit="saveFeedback(event)">
                <input type="hidden" id="feed-result-id">
                <textarea id="feed-text" rows="4" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-red-600 outline-none" placeholder="Escribe tu corrección táctica aquí..."></textarea>
                <div class="flex justify-end space-x-3 pt-4 mt-4 border-t border-gray-100">
                    <button type="button" onclick="closeFeedbackModal()" class="px-5 py-2.5 bg-gray-100 text-gray-800 rounded-lg font-bold">Cancelar</button>
                    <button type="submit" class="px-5 py-2.5 bg-red-600 text-white rounded-lg font-bold hover:bg-red-700">Guardar Comentario</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modales genéricos de Alerta -->
    <div id="alert-modal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm hidden flex items-center justify-center z-[100]">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl border border-gray-200 text-center">
            <div id="alert-icon-container" class="mx-auto w-12 h-12 rounded-full flex items-center justify-center mb-4"></div>
            <h3 id="alert-title" class="text-lg font-bold text-black mb-2">Mensaje</h3>
            <p id="alert-message" class="text-sm text-gray-600 mb-6"></p>
            <button onclick="closeAlertModal()" class="w-full bg-black text-white py-2.5 rounded-lg font-bold hover:bg-red-600 transition-colors">Aceptar</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function switchView(view) {
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('evaluations-view').classList.add('hidden');
            document.getElementById(view + '-view').classList.remove('hidden');
            
            document.getElementById('nav-dash').classList.replace('bg-red-50', 'text-gray-600');
            document.getElementById('nav-dash').classList.replace('text-red-700', 'hover:bg-gray-50');
            document.getElementById('nav-dash').classList.replace('border-red-600', 'border-transparent');
            
            document.getElementById('nav-eval').classList.replace('bg-red-50', 'text-gray-600');
            document.getElementById('nav-eval').classList.replace('text-red-700', 'hover:bg-gray-50');
            document.getElementById('nav-eval').classList.replace('border-red-600', 'border-transparent');

            if(view === 'dashboard') {
                document.getElementById('nav-dash').classList.add('bg-red-50', 'text-red-700', 'border-red-600');
            } else {
                document.getElementById('nav-eval').classList.add('bg-red-50', 'text-red-700', 'border-red-600');
            }
        }
    </script>
</body>
</html>
