<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Cloud | Panel Administrador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 flex h-screen overflow-hidden">

    <aside class="w-72 bg-white border-r border-gray-200 flex flex-col z-20 shadow-sm relative">
        <div class="absolute top-0 left-0 w-full h-1.5 bg-red-600"></div>
        <div class="h-28 flex items-center justify-center border-b border-gray-100 mt-1">
            <img src="https://i.ibb.co/DHmrYHsN/Group-339.png" alt="Security Cloud Logo" class="h-10 object-contain">
        </div>
        
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <p class="px-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Módulos Administrativos</p>
            
            <a href="#" onclick="showAdminTab('schools-section', this)" class="admin-tab flex items-center px-4 py-3 bg-red-50 text-red-700 rounded-lg font-bold transition-colors border-l-4 border-red-600">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                Escuelas Registradas
            </a>
            <a href="#" onclick="showAdminTab('operators-section', this)" class="admin-tab flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-black rounded-lg font-semibold transition-colors border-l-4 border-transparent">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                Personal Registrado
            </a>
        </nav>
        
        <div class="p-4 border-t border-gray-100">
            <button onclick="logout()" class="flex items-center justify-center w-full px-4 py-3 text-gray-600 hover:bg-red-50 hover:text-red-700 rounded-lg font-bold transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Cerrar Sesión
            </button>
        </div>
    </aside>

    <div class="flex-1 flex flex-col h-screen overflow-hidden bg-gray-50">
        <header class="h-20 bg-white border-b border-gray-200 shadow-sm px-8 flex justify-between items-center z-10">
            <h2 class="text-xl font-extrabold text-black tracking-tight" id="header-title">Gestión de Escuelas</h2>
            <div class="flex items-center space-x-4">
                <div class="text-right">
                    <span id="user-role" class="block text-[10px] font-bold text-red-600 uppercase tracking-wider"></span>
                    <span id="user-welcome" class="block text-sm font-bold text-black"></span>
                </div>
                <div class="w-10 h-10 bg-black text-white rounded-full flex items-center justify-center font-bold shadow-md">AD</div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-8 relative">
            
            <div id="schools-section" class="w-full max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                <div class="lg:col-span-5 bg-white p-8 rounded-2xl border border-gray-200 shadow-sm">
                    <h2 class="text-lg font-bold text-black border-b border-gray-100 pb-3 mb-5">Alta de Academias</h2>
                    <form onsubmit="createSchool(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Razón Social</label>
                            <input type="text" id="school-name" required class="w-full bg-gray-50 border border-gray-300 p-3 rounded-lg text-sm focus:ring-2 focus:ring-red-600 outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Usuario LMS</label>
                                <input type="text" id="school-username" required class="w-full bg-gray-50 border border-gray-300 p-3 rounded-lg text-sm focus:ring-2 focus:ring-red-600 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Contraseña</label>
                                <input type="password" id="school-password" required class="w-full bg-gray-50 border border-gray-300 p-3 rounded-lg text-sm focus:ring-2 focus:ring-red-600 outline-none">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Plan</label>
                                <select id="school-plan" class="w-full bg-gray-50 border border-gray-300 p-3 rounded-lg text-sm focus:ring-2 focus:ring-red-600 outline-none cursor-pointer">
                                    <option value="Pago Por Alumno">Por Alumno</option>
                                    <option value="Suscripción Mensual">Mensualidad</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Límite</label>
                                <input type="number" id="school-limit" value="50" min="1" required class="w-full bg-gray-50 border border-gray-300 p-3 rounded-lg text-sm focus:ring-2 focus:ring-red-600 outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">URL Logo (Opcional)</label>
                            <input type="url" id="school-icon" placeholder="https://ejemplo.com/logo.png" class="w-full bg-gray-50 border border-gray-300 p-3 rounded-lg text-sm focus:ring-2 focus:ring-red-600 outline-none">
                        </div>
                        <button type="submit" class="w-full bg-black text-white p-3.5 rounded-lg font-bold shadow-md hover:bg-red-600 transition-colors mt-2">
                            Crear Entorno LMS
                        </button>
                    </form>
                </div>
                
                <div class="lg:col-span-7 bg-white p-8 rounded-2xl border border-gray-200 shadow-sm flex flex-col h-[600px]">
                    <h2 class="text-lg font-bold mb-2 text-black border-b border-gray-100 pb-4">Academias Operativas</h2>
                    <ul id="school-list" class="flex-1 overflow-y-auto pr-2 mt-4 space-y-3"></ul>
                </div>
            </div>

            <div id="operators-section" class="hidden w-full max-w-6xl mx-auto flex flex-col space-y-6">
                <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm flex justify-between items-center">
                    <div class="flex items-center space-x-4 w-1/2">
                        <label class="text-sm font-bold text-gray-700 whitespace-nowrap">Filtrar por Escuela:</label>
                        <select id="filter-school" onchange="renderOperatorsTable()" class="w-full bg-gray-50 border border-gray-300 p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-red-600 outline-none cursor-pointer">
                            <option value="all">Todas las escuelas</option>
                        </select>
                    </div>
                    <button onclick="openOperatorModal()" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2.5 rounded-lg font-bold transition-colors shadow-sm">
                        + Nuevo Operador
                    </button>
                </div>
                <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
                    <table class="w-full text-left text-sm text-gray-600">
                        <thead class="bg-gray-100 text-gray-800 uppercase font-bold border-b border-gray-200">
                            <tr>
                                <th class="px-6 py-4">ID Operador / Usuario</th>
                                <th class="px-6 py-4">Escuela Perteneciente</th>
                                <th class="px-6 py-4 text-center">Acciones Tácticas</th>
                            </tr>
                        </thead>
                        <tbody id="operators-tbody" class="divide-y divide-gray-100 bg-white"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modales -->
    <div id="edit-school-modal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white w-full max-w-md rounded-2xl p-8 shadow-2xl border border-gray-200">
            <h3 class="text-xl font-bold text-black mb-4 border-b border-gray-100 pb-3">Editar Escuela</h3>
            <form id="edit-school-form" onsubmit="saveEditSchool(event)" class="space-y-4">
                <input type="hidden" id="edit-school-id">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Razón Social</label>
                    <input type="text" id="edit-school-name" required class="w-full bg-gray-50 border border-gray-300 p-3 rounded-lg text-sm focus:ring-2 focus:ring-red-600 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Plan</label>
                        <select id="edit-school-plan" class="w-full bg-gray-50 border border-gray-300 p-3 rounded-lg text-sm focus:ring-2 focus:ring-red-600 outline-none cursor-pointer">
                            <option value="Pago Por Alumno">Por Alumno</option>
                            <option value="Suscripción Mensual">Mensualidad</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Límite</label>
                        <input type="number" id="edit-school-limit" min="1" required class="w-full bg-gray-50 border border-gray-300 p-3 rounded-lg text-sm focus:ring-2 focus:ring-red-600 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">URL Logo (Opcional)</label>
                    <input type="url" id="edit-school-icon" placeholder="https://ejemplo.com/logo.png" class="w-full bg-gray-50 border border-gray-300 p-3 rounded-lg text-sm focus:ring-2 focus:ring-red-600 outline-none">
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t border-gray-100">
                    <button type="button" onclick="closeEditSchoolModal()" class="px-5 py-2.5 bg-gray-100 text-gray-800 rounded-lg font-bold hover:bg-gray-200">Cancelar</button>
                    <button type="submit" class="px-5 py-2.5 bg-black text-white rounded-lg font-bold hover:bg-red-600 transition-colors">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <div id="operator-modal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white w-full max-w-md rounded-2xl p-8 shadow-2xl border border-gray-200">
            <h3 class="text-xl font-bold text-black mb-4 border-b border-gray-100 pb-3" id="op-modal-title">Gestión de Operador</h3>
            <form id="op-modal-form" onsubmit="saveOperator(event)" class="space-y-4">
                <input type="hidden" id="op-id">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Escuela Asignada</label>
                    <select id="op-school-id" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-red-600 outline-none cursor-pointer"></select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Nombre Usuario / ID</label>
                    <input type="text" id="op-username" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-red-600 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Contraseña</label>
                    <input type="text" id="op-password" placeholder="(Opcional para actualizar)" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-red-600 outline-none">
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t border-gray-100">
                    <button type="button" onclick="closeOperatorModal()" class="px-5 py-2.5 bg-gray-100 text-gray-800 rounded-lg font-bold hover:bg-gray-200">Cancelar</button>
                    <button type="submit" class="px-5 py-2.5 bg-black text-white rounded-lg font-bold hover:bg-red-600 transition-colors">Guardar Datos</button>
                </div>
            </form>
        </div>
    </div>

    <div id="alert-modal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm hidden flex items-center justify-center z-[100]">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl border border-gray-200 text-center">
            <div id="alert-icon-container" class="mx-auto w-12 h-12 rounded-full flex items-center justify-center mb-4"></div>
            <h3 id="alert-title" class="text-lg font-bold text-black mb-2">Mensaje</h3>
            <p id="alert-message" class="text-sm text-gray-600 mb-6"></p>
            <button onclick="closeAlertModal()" class="w-full bg-black text-white py-2.5 rounded-lg font-bold hover:bg-red-600 transition-colors">Aceptar</button>
        </div>
    </div>

    <div id="confirm-modal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm hidden flex items-center justify-center z-[100]">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl border border-gray-200 text-center">
            <div class="mx-auto w-12 h-12 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center mb-4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <h3 id="confirm-title" class="text-lg font-bold text-black mb-2">¿Estás seguro?</h3>
            <p id="confirm-message" class="text-sm text-gray-600 mb-6"></p>
            <div class="flex justify-center space-x-3">
                <button onclick="closeConfirmModal(false)" class="px-5 py-2.5 bg-gray-100 text-gray-800 rounded-lg font-bold hover:bg-gray-200">Cancelar</button>
                <button onclick="closeConfirmModal(true)" class="px-5 py-2.5 bg-red-600 text-white rounded-lg font-bold hover:bg-red-700">Sí, continuar</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
