<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Cloud | Panel Administrador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 flex h-screen overflow-hidden">

    <!-- ================= MENÚ LATERAL IZQUIERDO ================= -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col z-20 shadow-sm relative">
        <div class="absolute top-0 left-0 w-full h-1.5 bg-red-600"></div>
        <div class="h-20 flex items-center px-6 border-b border-gray-100 mt-1">
            <img src="https://i.ibb.co/DHmrYHsN/Group-339.png" alt="Security Cloud Logo" class="h-8 object-contain">
        </div>
        
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <p class="px-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Gestión Principal</p>
            
            <a href="#" class="flex items-center px-4 py-3 bg-red-50 text-red-700 rounded-lg font-bold transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                Escuelas Registradas
            </a>
            <a href="#" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-black rounded-lg font-semibold transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                Creación de Perfiles
            </a>
            <a href="#" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-black rounded-lg font-semibold transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                Personal Registrado
            </a>
            <a href="#" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-black rounded-lg font-semibold transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Pruebas Realizadas
            </a>
        </nav>
        
        <div class="p-4 border-t border-gray-100">
            <button onclick="logout()" class="flex items-center w-full px-4 py-3 text-gray-600 hover:bg-red-50 hover:text-red-700 rounded-lg font-bold transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Cerrar Sesión
            </button>
        </div>
    </aside>

    <!-- ================= CONTENIDO PRINCIPAL ================= -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <header class="h-20 bg-white border-b border-gray-200 shadow-sm px-8 flex justify-between items-center z-10">
            <h2 class="text-xl font-extrabold text-black tracking-tight">Panel de Control General</h2>
            <div class="flex items-center space-x-4">
                <div class="text-right">
                    <span id="user-role" class="block text-[10px] font-bold text-red-600 uppercase tracking-wider"></span>
                    <span id="user-welcome" class="block text-sm font-bold text-black"></span>
                </div>
                <div class="w-10 h-10 bg-black text-white rounded-full flex items-center justify-center font-bold shadow-md">
                    AD
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-8 flex justify-center">
            <div class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
                <!-- Formulario Alta -->
                <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm">
                    <div class="flex items-center mb-6">
                        <div class="w-10 h-10 bg-black text-white rounded-lg flex items-center justify-center mr-4">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                        </div>
                        <div>
                            <h2 class="text-xl font-bold text-black">Alta de Academias</h2>
                            <p class="text-xs text-gray-500">Registra nuevas escuelas en la plataforma SaaS.</p>
                        </div>
                    </div>
                    
                    <form onsubmit="createSchool(event)" class="space-y-5">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Razón Social / Nombre</label>
                            <input type="text" id="school-name" placeholder="Ej. Academia Los Centauros" required class="w-full bg-gray-50 border border-gray-300 p-3.5 rounded-lg text-sm focus:ring-2 focus:ring-red-600 outline-none transition-shadow">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Plan de Suscripción</label>
                            <select id="school-plan" class="w-full bg-gray-50 border border-gray-300 p-3.5 rounded-lg text-sm focus:ring-2 focus:ring-red-600 outline-none transition-shadow cursor-pointer">
                                <option value="Pago Por Alumno">Pago Por Alumno (Pines)</option>
                                <option value="Suscripción Mensual">Suscripción Mensual Ilimitada</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-black text-white p-4 rounded-lg font-bold shadow-md hover:bg-red-600 transition-colors mt-2">
                            Crear Entorno LMS
                        </button>
                    </form>
                </div>
                
                <!-- Lista -->
                <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm flex flex-col h-[500px]">
                    <h2 class="text-xl font-bold mb-2 text-black border-b border-gray-100 pb-4">Academias Operativas</h2>
                    <ul id="school-list" class="flex-1 overflow-y-auto pr-2 mt-4 space-y-3"></ul>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
