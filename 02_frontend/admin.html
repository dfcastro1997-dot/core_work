<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Cloud | Panel Administrador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen flex flex-col overflow-hidden">

    <header class="bg-white border-b border-gray-200 shadow-sm p-5 flex justify-between items-center z-10">
        <h1 class="text-xl md:text-2xl font-extrabold tracking-tight text-black">
            SECURITY <span class="text-red-600">CLOUD</span>
        </h1>
        <div class="flex items-center space-x-6">
            <div class="flex flex-col text-right">
                <span id="user-role" class="text-[10px] font-bold text-red-600 uppercase tracking-wider"></span>
                <span id="user-welcome" class="text-sm font-bold text-black"></span>
            </div>
            <button onclick="logout()" class="text-xs bg-black text-white px-4 py-2 rounded-lg font-bold hover:bg-gray-800 transition-colors shadow-sm">
                Salir
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-6 md:p-10 flex flex-col items-center">
        <div class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Formulario Alta -->
            <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm">
                <div class="flex items-center mb-2">
                    <div class="w-8 h-8 bg-black text-white rounded-md flex items-center justify-center mr-3">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                    </div>
                    <h2 class="text-xl font-bold text-black">Alta de Academias</h2>
                </div>
                <p class="text-sm text-gray-500 mb-6 ml-11">Registra nuevas escuelas en la plataforma SaaS.</p>
                
                <form onsubmit="createSchool(event)" class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Razón Social / Nombre</label>
                        <input type="text" id="school-name" placeholder="Ej. Academia Los Centauros" required class="w-full bg-gray-50 border border-gray-300 p-3 rounded-lg text-sm focus:ring-2 focus:ring-red-600 outline-none transition-shadow">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Plan de Suscripción</label>
                        <select id="school-plan" class="w-full bg-gray-50 border border-gray-300 p-3 rounded-lg text-sm focus:ring-2 focus:ring-red-600 outline-none transition-shadow cursor-pointer">
                            <option value="Pago Por Alumno">Pago Por Alumno (Pines)</option>
                            <option value="Suscripción Mensual">Suscripción Mensual Ilimitada</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-black text-white p-3.5 rounded-lg font-bold shadow-md hover:bg-red-600 transition-colors mt-2">
                        Crear Entorno LMS
                    </button>
                </form>
            </div>
            
            <!-- Lista -->
            <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm flex flex-col">
                <h2 class="text-xl font-bold mb-2 text-black border-b border-gray-100 pb-4">Academias Operativas</h2>
                <ul id="school-list" class="flex-1 overflow-y-auto pr-2 mt-4 space-y-3"></ul>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
