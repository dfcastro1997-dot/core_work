<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORE-WORK | Kanban & Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #0F172A; }
        .kanban-col { min-height: 500px; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Menú Lateral -->
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col z-10">
        <div class="h-16 flex items-center px-6 border-b border-slate-200">
            <h1 class="text-2xl font-bold tracking-tighter text-slate-900">CORE<span class="text-red-600">-WORK</span></h1>
        </div>
        
        <nav class="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto custom-scroll">
            <!-- Dashboard -->
            <a href="index.html" class="flex items-center px-4 py-2.5 text-slate-600 hover:bg-slate-100 hover:text-slate-900 rounded-lg font-medium transition-all">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Dashboard
            </a>
            
            <!-- Tablero Kanban (ACTIVO) -->
            <a href="kanban.html" class="flex items-center px-4 py-2.5 bg-slate-900 text-white rounded-lg font-semibold transition-all shadow-sm">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"></path></svg>
                Tablero Kanban
            </a>

            <!-- Agenda -->
            <a href="agenda.html" class="flex items-center px-4 py-2.5 text-slate-600 hover:bg-slate-100 hover:text-slate-900 rounded-lg font-medium transition-all">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                Agenda
            </a>

            <!-- Finanzas -->
            <a href="finanzas.html" class="flex items-center px-4 py-2.5 text-slate-600 hover:bg-slate-100 hover:text-slate-900 rounded-lg font-medium transition-all">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Finanzas
            </a>

            <!-- Telaraña -->
            <a href="telarana.html" class="flex items-center px-4 py-2.5 text-slate-600 hover:bg-slate-100 hover:text-slate-900 rounded-lg font-medium transition-all">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                Telaraña
            </a>

            <!-- Configuraciones -->
            <a href="configuraciones.html" class="flex items-center px-4 py-2.5 text-slate-600 hover:bg-slate-100 hover:text-slate-900 rounded-lg font-medium transition-all">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Configuraciones
            </a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-y-auto bg-slate-100/50">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 sticky top-0 z-20">
            <h2 class="text-lg font-semibold text-slate-800">Flujo de Trabajo (Kanban)</h2>
            
            <!-- TIME TRACKER GLOBAL -->
            <div class="flex items-center space-x-3 bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 shadow-sm">
                <select id="tracker-task-select" class="text-xs bg-transparent focus:outline-none w-48 font-medium text-slate-700 cursor-pointer">
                    <option value="">Seleccionar tarea...</option>
                </select>
                <div class="font-mono text-sm font-bold text-indigo-600 w-16 text-center" id="tracker-display">00:00</div>
                <button onclick="toggleTimer()" id="tracker-btn" class="w-6 h-6 rounded-full bg-slate-900 text-white flex items-center justify-center hover:bg-slate-800 transition shadow-sm">
                    <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4l12 6-12 6z"></path></svg>
                </button>
            </div>
        </header>

        <div class="p-8">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <!-- COLUMNA 1: To Do -->
                <div class="flex flex-col bg-slate-100/80 rounded-xl border border-slate-200 shadow-sm">
                    <div class="p-3 border-b border-slate-200 bg-slate-200/50 rounded-t-xl">
                        <h3 class="font-bold text-xs text-slate-700 uppercase tracking-wider">Por Hacer</h3>
                    </div>
                    <div id="col-todo" class="kanban-col p-3 space-y-3" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                </div>

                <!-- COLUMNA 2: In Progress -->
                <div class="flex flex-col bg-slate-100/80 rounded-xl border border-slate-200 shadow-sm">
                    <div class="p-3 border-b border-slate-200 bg-indigo-100/50 rounded-t-xl">
                        <h3 class="font-bold text-xs text-indigo-700 uppercase tracking-wider">En Progreso</h3>
                    </div>
                    <div id="col-in_progress" class="kanban-col p-3 space-y-3" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                </div>

                <!-- COLUMNA 3: Review -->
                <div class="flex flex-col bg-slate-100/80 rounded-xl border border-slate-200 shadow-sm">
                    <div class="p-3 border-b border-slate-200 bg-amber-100/50 rounded-t-xl">
                        <h3 class="font-bold text-xs text-amber-700 uppercase tracking-wider">En Revisión</h3>
                    </div>
                    <div id="col-review" class="kanban-col p-3 space-y-3" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                </div>

                <!-- COLUMNA 4: Done -->
                <div class="flex flex-col bg-slate-100/80 rounded-xl border border-slate-200 shadow-sm">
                    <div class="p-3 border-b border-slate-200 bg-emerald-100/50 rounded-t-xl">
                        <h3 class="font-bold text-xs text-emerald-700 uppercase tracking-wider">Completado</h3>
                    </div>
                    <div id="col-done" class="kanban-col p-3 space-y-3" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
